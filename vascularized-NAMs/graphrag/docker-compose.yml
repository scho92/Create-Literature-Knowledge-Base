services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fro-graphrag-neo4j
    ports:
      - "7474:7474"   # browser UI -> http://localhost:7474
      - "7687:7687"   # bolt protocol (used by the python driver)
    environment:
      - NEO4J_AUTH=neo4j/graphrag-local-dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
